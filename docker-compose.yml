###############################################################################
# Vigilia — Docker Compose (Production-Ready Base)
# Servicios: modelo_IA, backend, frontend, postgres, mongodb, redis,
#            rabbitmq, minio
###############################################################################

services:
  # =========================================================================
  # 🧠  CORE / INTELIGENCIA ARTIFICIAL
  # =========================================================================
  modelo-ia:
    build:
      context: ./modelo_IA
      dockerfile: Dockerfile
    container_name: vigilia-modelo-ia
    restart: unless-stopped
    ports:
      - "${IA_PORT:-5000}:5000"
      - "${ALERT_PORT:-8080}:8080"
    volumes:
      - ./modelo_IA:/app
      - ia-models:/app/models
      - minio-data:/shared/minio
    env_file:
      - .env
      - ./modelo_IA/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - VISUALIZER_HOST=0.0.0.0
      - VISUALIZER_PORT=5000
      - ALERT_HOST=0.0.0.0
      - ALERT_PORT=8080
      - ALERT_OPEN_BROWSER=false
      - VISUALIZER_LOCAL_WINDOW=false    # el contenedor no tiene pantalla
      - ENABLE_WEB_STREAM=true           # en Docker la salida es el stream web :5000/stream
    stop_grace_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - vigilia-net

  # =========================================================================
  # ⚙️  BACKEND — FastAPI
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vigilia-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - vigilia-net

  # =========================================================================
  # 🎨  FRONTEND — React + Vite + TypeScript
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vigilia-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - vigilia-net

  # =========================================================================
  # 📦  INFRAESTRUCTURA
  # =========================================================================

  # ---- PostgreSQL ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vigilia-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigilia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vigilia_secret}
      POSTGRES_DB: ${POSTGRES_DB:-vigilia_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vigilia}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilia-net

  # ---- MongoDB ---------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: vigilia-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-vigilia}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-vigilia_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-vigilia_db}
    volumes:
      - mongodb-data:/data/db
    networks:
      - vigilia-net

  # ---- Redis -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vigilia-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-vigilia_secret}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vigilia_secret}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilia-net

  # ---- RabbitMQ --------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vigilia-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-vigilia}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-vigilia_secret}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "check_running" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vigilia-net

  # ---- MinIO (Object Storage) -----------------------------------------------
  # ---- MinIO (Object Storage) -----------------------------------------------
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: vigilia-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-vigilia}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-vigilia123}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - vigilia-net

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres-data:
    driver: local
  mongodb-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local
  ia-models:
    driver: local
  frontend-node-modules:
    driver: local

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  vigilia-net:
    driver: bridge
    name: vigilia-net
